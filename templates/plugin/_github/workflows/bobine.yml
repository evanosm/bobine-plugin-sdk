# Checks and packages the plugin on every push and pull request; the .bobine-ext archive is
# kept as a build artifact. Needs the SDK from npm in package.json (not a local file: path).
name: Bobine plugin

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
      - run: pnpm install
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm exec bobine-plugin check
      - run: pnpm exec bobine-plugin pack --out extension.bobine-ext
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: extension
          path: extension.bobine-ext
